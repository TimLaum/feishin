name: Fork Release (Windows)

# Déclenché par scripts/fork-release.sh (push d'un tag vX.Y.Z).
# Publie l'installeur NSIS + latest.yml sur les releases de TimLaum/feishin,
# là où electron-updater des PC va chercher les mises à jour.
on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write

jobs:
    publish:
        if: github.repository == 'TimLaum/feishin'
        runs-on: windows-latest

        steps:
            - name: Checkout git repo
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            # Le brouillon est créé avant le build : sinon les uploads parallèles
            # d'electron-builder créent chacun leur release (doublons sur un même tag).
            # Le texte = commits du fork depuis la dernière release publiée (modale de notes de version).
            - name: Create draft release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  prev=$(gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
                  notes=$(git log --first-parent --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" | grep -v 'chore(release)' || true)
                  gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                      --title "${GITHUB_REF_NAME#v}" --notes "${notes:-Pas de changement notable.}"

            - name: Install PNPM
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

            # Cache du store pnpm : sans lui, les ~1 200 paquets sont retéléchargés à chaque release
            - name: Install Node (pnpm cache)
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  cache: pnpm
                  node-version: 24

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build and upload to draft release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Interface (electron-vite) et télécommande web sont indépendantes : en parallèle
                  pnpm run build:electron &
                  electron_build=$!
                  pnpm run build:remote
                  wait "$electron_build"
                  pnpm exec electron-builder --config electron-builder-fork.yml --win nsis --x64 --publish always

            - name: Publish release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
