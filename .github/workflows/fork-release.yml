name: Fork Release (Windows)

# Déclenché par scripts/fork-release.sh (push d'un tag vX.Y.Z).
# Publie l'installeur NSIS + latest.yml sur les releases de TimLaum/feishin,
# là où electron-updater des PC va chercher les mises à jour.
on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write

jobs:
    publish:
        if: github.repository == 'TimLaum/feishin'
        runs-on: windows-latest

        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Le brouillon est créé avant le build : sinon les uploads parallèles
            # d'electron-builder créent chacun leur release (doublons sur un même tag).
            # Le texte = commits du fork depuis la dernière release publiée (modale de notes de version).
            - name: Create draft release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  prev=$(gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
                  notes=$(git log --first-parent --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" | grep -v 'chore(release)' || true)
                  gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                      --title "${GITHUB_REF_NAME#v}" --notes "${notes:-Pas de changement notable.}"

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Build and upload to draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: >
                  pnpm run build &&
                  pnpm exec electron-builder --config electron-builder-fork.yml
                  --win nsis --x64 --publish always

            - name: Publish release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
